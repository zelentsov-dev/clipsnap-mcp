<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="snap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <!-- Clipboard body -->
  <rect x="30" y="28" width="60" height="72" rx="6" fill="white" opacity="0.95"/>
  <!-- Clipboard clip -->
  <rect x="44" y="20" width="32" height="16" rx="4" fill="white" opacity="0.95"/>
  <rect x="50" y="16" width="20" height="12" rx="6" fill="url(#bg)" stroke="white" stroke-width="2"/>
  <!-- Image icon on clipboard -->
  <rect x="40" y="48" width="40" height="30" rx="4" fill="#e0e7ff"/>
  <!-- Mountain in image -->
  <polygon points="44,74 56,56 64,66 68,60 76,74" fill="#6366f1" opacity="0.6"/>
  <!-- Sun in image -->
  <circle cx="68" cy="55" r="5" fill="url(#snap)"/>
  <!-- Lightning bolt (snap) -->
  <polygon points="82,38 74,52 80,52 72,68 84,52 78,52" fill="url(#snap)" opacity="0.9"/>
</svg>
